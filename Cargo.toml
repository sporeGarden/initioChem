# SPDX-License-Identifier: AGPL-3.0-or-later
#
# initioChem — interactive computational chemistry explorer.
#
# Not a spring. A standalone sporeGarden product that IS the primals working
# together as a molecular research platform. Exercises hotSpring's CompChem
# pipeline via BYOB composition and feeds visualization/tessellation gaps back
# into petalTongue and barraCuda.

[workspace]
resolver = "2"
members = [
    "src",
]

[workspace.package]
edition = "2024"
rust-version = "1.87"
license = "AGPL-3.0-or-later"
repository = "https://github.com/sporeGarden/initioChem"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
expect_used = "deny"
unwrap_used = "deny"
